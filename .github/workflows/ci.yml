name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifications:
    name: Types, tests unitaires, construction, budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Audit des dépendances
        run: npm audit --audit-level=low
      - run: npm run typecheck
      - run: npm test
      - name: Confidentialité (garde-fou à empreintes salées, dépôt public)
        run: |
          python3 -m pip install --quiet --disable-pip-version-check 'pytest>=8,<9'
          python3 -m pytest -q -p no:cacheprovider tests/test_confidentialite.py
      - run: npm run build
      - name: Budget (première page < 150 Ko, une animation par fichier)
        run: node outils/budget.mjs

  navigateurs:
    name: Bout en bout (Chromium, Firefox, WebKit × téléphone, tablette, bureau)
    needs: verifications
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts
      - run: npm run build
      - name: Tests Playwright
        run: npx playwright test
        env:
          HOME: /root
      - name: Captures et rapports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures-et-rapports
          path: test-results/
          retention-days: 14
